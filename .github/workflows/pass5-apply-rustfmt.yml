name: Pass 5 Apply Rustfmt

on:
  push:
    branches:
      - issue/105-m001-pass-5-implementation
    paths:
      - .github/workflows/pass5-apply-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/105-m001-pass-5-implementation
      - name: Bootstrap pinned toolchain
        run: make bootstrap
      - name: Apply pinned rustfmt only
        run: cargo fmt --all
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet -- '*.rs'; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs'
          git commit -m 'style: apply pinned rustfmt to Pass 5'
          git push origin HEAD:issue/105-m001-pass-5-implementation
