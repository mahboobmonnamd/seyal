name: Pass 5 Repair And Format

on:
  push:
    branches:
      - issue/105-m001-pass-5-implementation
    paths:
      - .github/workflows/pass5-repair-format.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/105-m001-pass-5-implementation
      - name: Repair benchmark compile seams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/seyal-runtime/benches/pass5_production_transport.rs')
          text = path.read_text()
          text = text.replace('''\n    fn gated(self) -> bool {\n        self != Self::Interactive\n    }\n''', '\n')
          text = text.replace('let mut stream = UnixStream::connect(socket_path).expect("connect production UDS");', 'let stream = UnixStream::connect(socket_path).expect("connect production UDS");')
          text = text.replace('attachment_id: seyal_runtime::AttachmentId::new(),', 'attachment_id: seyal_runtime::AttachmentId::from_bytes([0; 16]),')
          text = text.replace(' bytes_reallocated={}', '')
          text = text.replace('        allocation_stats.bytes_reallocated,\n', '')
          path.write_text(text)
          PY
      - name: Apply pinned rustfmt
        run: |
          make bootstrap
          cargo fmt --all
      - name: Commit repaired formatted Rust only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: format and compile Candidate-D validation surface'
          git push origin HEAD:issue/105-m001-pass-5-implementation
