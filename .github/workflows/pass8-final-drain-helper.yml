name: Pass 8 Final Drain Helper

on:
  push:
    branches:
      - issue/715-pass8-block-metadata

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/715-pass8-block-metadata
      - run: python3 scripts/pass8-final-drain-repair.py
      - run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
      - run: git diff --check
      - name: Commit final-drain repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/seyal-runtime/src/runtime.rs
          git commit -m "Pass 8: preserve bounded final PTY drain"
          git push origin HEAD:issue/715-pass8-block-metadata
