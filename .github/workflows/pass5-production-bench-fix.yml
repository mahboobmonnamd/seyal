name: Pass 5 Production Bench Fix

on:
  push:
    branches:
      - issue/105-m001-pass-5-implementation
    paths:
      - .github/workflows/pass5-production-bench-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/105-m001-pass-5-implementation
      - name: Repair Candidate-D macOS validation surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bench = Path('crates/seyal-runtime/benches/pass5_production_transport.rs')
          s = bench.read_text()
          old = 'use stats_alloc::{INSTRUMENTED_SYSTEM, StatsAlloc};\n'
          new = 'use stats_alloc::{INSTRUMENTED_SYSTEM, StatsAlloc};\n#[cfg(target_os = "macos")]\nuse stats_alloc::Region;\n'
          if old not in s:
              raise SystemExit('stats_alloc import anchor missing')
          s = s.replace(old, new, 1)
          old_branch = '''Err(error) if error.kind() == std::io::ErrorKind::WouldBlock => runtime\n                .poll_once(Some(Duration::from_millis(1)))\n                .expect("Runtime poll"),'''
          new_branch = '''Err(error) if error.kind() == std::io::ErrorKind::WouldBlock => {\n                runtime\n                    .poll_once(Some(Duration::from_millis(1)))\n                    .expect("Runtime poll");\n            }'''
          if s.count(old_branch) != 2:
              raise SystemExit(f'expected 2 WouldBlock branches, found {s.count(old_branch)}')
          bench.write_text(s.replace(old_branch, new_branch))

          local = Path('crates/seyal-runtime/src/runtime/local.rs')
          s = local.read_text()
          old = '''            } else {\n                let base_generation = previous.expect("checked above").generation;\n                match display::encode_delta(&update, base_generation) {'''
          new = '''            } else if let Some(previous) = previous {\n                let base_generation = previous.generation;\n                match display::encode_delta(&update, base_generation) {'''
          if old not in s:
              raise SystemExit('macOS publication control-flow anchor missing')
          local.write_text(s.replace(old, new, 1))

          cargo = Path('crates/seyal-runtime/Cargo.toml')
          s = cargo.read_text()
          for legacy in [
              '''[[bench]]\nname = "pass5_transport_stress"\nharness = false\nrequired-features = ["benchmark-shared-projection"]\n\n''',
              '''[[bench]]\nname = "pass5_shared_projection"\nharness = false\nrequired-features = ["benchmark-shared-projection"]\n\n''',
          ]:
              if legacy not in s:
                  raise SystemExit('expected obsolete shared-projection benchmark target missing')
              s = s.replace(legacy, '', 1)
          cargo.write_text(s)

          delta = Path('crates/seyal-runtime/benches/pass5_delta_transport.rs')
          s = delta.read_text()
          old = '((values.len() * pct + 99) / 100)'
          new = '(values.len() * pct).div_ceil(100)'
          if s.count(old) != 2:
              raise SystemExit(f'expected 2 manual div_ceil expressions, found {s.count(old)}')
          delta.write_text(s.replace(old, new))
          PY
      - name: Validate pinned format clippy tests and macOS benchmark compilation
        run: |
          make bootstrap
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --locked
          cargo bench -p seyal-runtime --bench pass5_production_transport --no-run --locked
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/seyal-runtime/Cargo.toml crates/seyal-runtime/benches/pass5_delta_transport.rs crates/seyal-runtime/benches/pass5_production_transport.rs crates/seyal-runtime/src/runtime/local.rs
          git commit -m 'fix: validate Candidate-D production path on macOS'
          git push origin HEAD:issue/105-m001-pass-5-implementation
