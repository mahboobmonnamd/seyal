name: spike-685-scrollback

on:
  pull_request:
    paths:
      - "spikes/issue-685-scrollback/**"
      - ".github/workflows/spike-685-scrollback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    if: github.head_ref == 'spike/685-m002-scrollback-rd' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format temporary checkout
        run: cargo fmt --manifest-path spikes/issue-685-scrollback/Cargo.toml
      - name: Lint
        run: cargo clippy --manifest-path spikes/issue-685-scrollback/Cargo.toml --all-targets -- -D warnings
      - name: Run experiments
        run: cargo run --manifest-path spikes/issue-685-scrollback/Cargo.toml --release
      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-685-scrollback-spike-report
          path: spike-report.md
          if-no-files-found: error
