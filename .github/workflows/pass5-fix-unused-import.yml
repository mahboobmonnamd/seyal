name: Pass 5 Fix Unused Import

on:
  push:
    branches:
      - issue/105-m001-pass-5-implementation
    paths:
      - .github/workflows/pass5-fix-unused-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/105-m001-pass-5-implementation
      - name: Remove stale stats_alloc Region imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'crates/seyal-runtime/benches/pass5_delta_transport.rs',
              'crates/seyal-runtime/benches/pass5_production_transport.rs',
          ]:
              p = Path(name)
              s = p.read_text()
              old = 'use stats_alloc::{INSTRUMENTED_SYSTEM, Region, StatsAlloc};'
              new = 'use stats_alloc::{INSTRUMENTED_SYSTEM, StatsAlloc};'
              if old not in s:
                  raise SystemExit(f'expected import not found in {name}')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit narrow clippy fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/seyal-runtime/benches/pass5_delta_transport.rs crates/seyal-runtime/benches/pass5_production_transport.rs
          git commit -m 'fix: remove stale benchmark Region imports'
          git push origin HEAD:issue/105-m001-pass-5-implementation
