name: Pass 4 Review Fix

on:
  push:
    branches: [issue/99-m001-pass-4-headless-runtime]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: issue/99-m001-pass-4-headless-runtime
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/seyal-runtime/src/runtime.rs')
          text = path.read_text()
          old = '''        if let Some(exit) = execution.try_wait()? {
            self.reactor.deregister(token)?;
            return Err(RuntimeError::ChildExitedBeforePublication(exit));
        }
'''
          new = '''        match execution.try_wait() {
            Ok(Some(exit)) => {
                self.reactor.deregister(token)?;
                return Err(RuntimeError::ChildExitedBeforePublication(exit));
            }
            Ok(None) => {}
            Err(error) => {
                let _ = self.reactor.deregister(token);
                self.kill_unpublished(execution);
                return Err(error.into());
            }
        }
'''
          if old not in text:
              raise SystemExit('expected create/register reconciliation block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('crates/seyal-runtime/src/main.rs')
          text = path.read_text()
          old = '''    let execution = runtime.create_execution(command, WindowSize::new(80, 24, 0, 0)?)?;
    let _attachment = runtime.attach(execution)?;

'''
          new = '''    runtime.create_execution(command, WindowSize::new(80, 24, 0, 0)?)?;

'''
          if old not in text:
              raise SystemExit('expected headless attachment block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all || true
          git rm .github/workflows/pass4-review-fix.yml
      - name: Commit production review fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates .github/workflows/pass4-review-fix.yml
          git commit -m 'fix: close Pass 4 review rollback gaps'
          git push origin HEAD:issue/99-m001-pass-4-headless-runtime
