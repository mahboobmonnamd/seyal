name: Pass 8 CI Repair Helper

on:
  push:
    branches:
      - issue/715-pass8-block-metadata

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/715-pass8-block-metadata
          fetch-depth: 0
      - run: git fetch origin master
      - run: python3 scripts/pass8-ci-repair.py
      - run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
      - run: git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pass 8: isolate native seam and raw fallback"
          git push origin HEAD:issue/715-pass8-block-metadata
