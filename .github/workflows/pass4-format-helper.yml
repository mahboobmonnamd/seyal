name: Pass 4 Format Helper

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'issue/99-m001-pass-4-headless-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: issue/99-m001-pass-4-headless-runtime
      - name: Bootstrap pinned Rust toolchain
        run: make bootstrap
      - name: Apply pinned rustfmt
        run: cargo +1.98.0 fmt --all
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates
          git commit -m 'style: apply pinned rustfmt'
          git push origin HEAD:issue/99-m001-pass-4-headless-runtime
