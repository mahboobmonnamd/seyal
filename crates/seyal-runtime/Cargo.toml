[package]
name = "seyal-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobenches = false
build = "build.rs"

[features]
default = []
test-fault-injection = ["seyal-exec/test-fault-injection"]
benchmark-shared-projection = []
benchmark-instrumentation = []

[dependencies]
seyal-core = { path = "../seyal-core" }
seyal-exec = { path = "../seyal-exec" }
seyal-protocol = { path = "../seyal-protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
stats_alloc = "=0.1.10"

[lints.rust]
unsafe_code = "deny"

[[bench]]
name = "pass5_delta_transport"
harness = false

[[bench]]
name = "pass5_production_transport"
harness = false
required-features = ["benchmark-instrumentation"]

# R&D-only prerequisite evidence for M001 Pass 9; never a production path.
[[bench]]
name = "pass9_preimplementation_calibration"
harness = false
