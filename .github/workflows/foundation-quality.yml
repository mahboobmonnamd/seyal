name: Foundation Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Governance structure
        run: make governance-check
      - name: Local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Architecture layering
        run: python3 scripts/check-layering.py

  canonical-tasks-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned toolchain
        run: make bootstrap
      - name: Canonical task interface
        run: |
          make build
          make test
          make check
          make bench

  canonical-tasks-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned toolchain and macOS prerequisites
        run: make bootstrap
      - name: Canonical task interface
        run: |
          make build
          make test
          make check
          make bench
