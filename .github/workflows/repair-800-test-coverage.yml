name: Repair 800 test coverage

on:
  push:
    branches: [fix/800-restore-foundation-quality]
    paths:
      - ".github/workflows/repair-800-test-coverage.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/800-restore-foundation-quality
          fetch-depth: 0
      - name: Add focused native regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          unit = Path("macos/Seyal/Tests/SeyalTests/SeyalShellComponentTests.swift")
          text = unit.read_text(encoding="utf-8")
          import_old = "import Metal\nimport XCTest\n"
          import_new = "import Metal\n@preconcurrency import QuartzCore\nimport XCTest\n"
          if text.count(import_old) != 1:
              raise SystemExit("unit test import anchor changed")
          text = text.replace(import_old, import_new, 1)
          anchor = "  @MainActor\n  private func normalizedModifiers(_ item: NSMenuItem) -> NSEvent.ModifierFlags {"
          test = "  @MainActor\n  func testNativeProtocolCompatibilityKeepsInteractiveSurfaceMainActorOwned() {\n    let surface = InteractiveMetalSurfaceView(\n      frame: NSRect(x: 0, y: 0, width: 320, height: 180),\n      paneID: \"protocol-compat\",\n      installation: .nativeInteractionProbe\n    )\n    let displayDelegate: any CAMetalDisplayLinkDelegate = surface\n    let textClient: any NSTextInputClient = surface\n\n    XCTAssertNotNil(displayDelegate as AnyObject)\n    XCTAssertNotNil(textClient as AnyObject)\n    XCTAssertTrue(surface.acceptsFirstResponder)\n    XCTAssertTrue(InteractiveMetalSurfaceView.pass7InputSelfTest())\n  }\n\n"
          if text.count(anchor) != 1:
              raise SystemExit("unit test insertion anchor changed")
          text = text.replace(anchor, test + anchor, 1)
          unit.write_text(text, encoding="utf-8")

          ui = Path("macos/Seyal/Tests/SeyalUITests/SeyalShellUITests.swift")
          text = ui.read_text(encoding="utf-8")
          anchor = "    func testLightAppearanceStillExposesTokenBackedShellChrome() {"
          test = "    func testProductionNativeSurfaceRemainsReachableAfterProtocolCompatibilityMigration() {\n        app.terminate()\n        let surface = launchProductionApp(requireUsableConnection: false)\n\n        XCTAssertTrue(surface.exists)\n        XCTAssertTrue(surface.isHittable)\n        surface.click()\n        XCTAssertTrue(surface.isHittable)\n    }\n\n"
          if text.count(anchor) != 1:
              raise SystemExit("UI test insertion anchor changed")
          text = text.replace(anchor, test + anchor, 1)
          ui.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Commit regression coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macos/Seyal/Tests/SeyalTests/SeyalShellComponentTests.swift macos/Seyal/Tests/SeyalUITests/SeyalShellUITests.swift
          git commit -m "test(macos): cover protocol compatibility migration"
          git push origin HEAD:fix/800-restore-foundation-quality
