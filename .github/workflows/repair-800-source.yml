name: Repair 800 source

on:
  push:
    branches: [fix/800-restore-foundation-quality]
    paths:
      - ".github/workflows/repair-800-source.yml"
      - "macos/Seyal/Sources/MetalSurfaceView.swift"
      - "macos/Seyal/Sources/TerminalInputSurface.swift"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/800-restore-foundation-quality
          fetch-depth: 0
      - name: Apply exact Swift conformance repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("macos/Seyal/Sources/MetalSurfaceView.swift"): (
                  "class MetalSurfaceView: NSView, @MainActor CAMetalDisplayLinkDelegate {",
                  "class MetalSurfaceView: NSView, @preconcurrency CAMetalDisplayLinkDelegate {",
              ),
              Path("macos/Seyal/Sources/TerminalInputSurface.swift"): (
                  "final class InteractiveMetalSurfaceView: MetalSurfaceView, @MainActor NSTextInputClient {",
                  "final class InteractiveMetalSurfaceView: MetalSurfaceView, @preconcurrency NSTextInputClient {",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one {old!r}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macos/Seyal/Sources/MetalSurfaceView.swift macos/Seyal/Sources/TerminalInputSurface.swift
          git commit -m "fix(macos): preserve main-actor protocol ownership on Xcode 16.4"
          git push origin HEAD:fix/800-restore-foundation-quality
