name: Foundation Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass5-benchmark-path-repair:
    name: pass5-benchmark-path-repair
    if: github.event_name == 'pull_request' && github.head_ref == 'issue/105-m001-pass-5-implementation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: issue/105-m001-pass-5-implementation
      - name: Bound benchmark-owned Unix socket path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/seyal-runtime/benches/pass5_production_transport.rs')
          s = p.read_text()
          begin = s.index('    let suffix = format!(\n')
          marker = '    let mut config = RuntimeConfig::m001().expect("M001 config");\n'
          end = s.index(marker, begin)
          replacement = (
              '    // Keep benchmark-owned filesystem paths intentionally short. Darwin Unix-domain\n'
              '    // sockets have a 104-byte sun_path limit; workload identity is reported separately.\n'
              '    // Each worker is a fresh process, so its PID uniquely scopes temporary paths.\n'
              '    let suffix = format!("{:x}", process::id());\n'
          )
          s = s[:begin] + replacement + s[end:]
          s = s.replace('format!("s5pd-{suffix}")', 'format!("s5d-{suffix}")', 1)
          p.write_text(s)
          PY
      - name: Format patch with pinned toolchain
        run: |
          make bootstrap
          cargo fmt --all
          git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet -- crates/seyal-runtime/benches/pass5_production_transport.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/seyal-runtime/benches/pass5_production_transport.rs
          git commit -m 'fix(bench): bound Candidate-D runtime socket path'
          git push origin HEAD:issue/105-m001-pass-5-implementation

  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Governance structure
        run: make governance-check
      - name: Local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Architecture layering
        run: python3 scripts/check-layering.py
      - name: Hot-path structural performance guardrails
        run: python3 scripts/check-hot-path.py
      - name: Benchmark contract guardrails
        run: python3 scripts/check-benchmark-contract.py
      - name: Harness contracts
        run: python3 scripts/test-harnesses.py
      - name: Fuzz registry smoke
        run: python3 scripts/fuzz-smoke.py
      - name: Validator negative fixtures
        run: python3 scripts/test-ci-validators.py

  rust-and-harness-quality:
    name: rust-and-harness-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned Rust toolchain
        run: make bootstrap
      - name: Build production Rust surface
        run: make build
      - name: Format lint unit and repository checks
        run: make check
      - name: Benchmark harness smoke
        run: make bench

  native-macos-smoke:
    name: native-macos-smoke
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned Rust and native toolchains
        run: make bootstrap
      - name: Build Rust plus Seyal.app
        run: make build
      - name: Unit harness PTY integration and native launch smoke
        run: make test
      - name: Native PTY benchmark baseline
        run: make bench
