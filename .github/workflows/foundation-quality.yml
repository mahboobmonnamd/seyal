name: Foundation Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/task.sh scripts/validate-governance.sh
      - name: Governance structure
        run: make governance-check
      - name: Local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Architecture layering
        run: python3 scripts/check-layering.py

  rust-workspace:
    if: ${{ hashFiles('Cargo.toml') != '' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deterministic toolchain exists
        run: test -f rust-toolchain.toml || { echo 'M001 Rust workspace requires rust-toolchain.toml'; exit 1; }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
