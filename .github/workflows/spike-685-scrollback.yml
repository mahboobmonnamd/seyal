name: spike-685-scrollback

on:
  pull_request:
    paths:
      - "spikes/issue-685-scrollback/**"
      - ".github/workflows/spike-685-scrollback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    if: github.head_ref == 'spike/685-m002-scrollback-rd' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format temporary checkout
        run: cargo fmt --manifest-path spikes/issue-685-scrollback/Cargo.toml
      - name: Compile spike
        run: cargo check --manifest-path spikes/issue-685-scrollback/Cargo.toml 2>&1 | tee spike-check.log
      - name: Run experiments
        run: cargo run --manifest-path spikes/issue-685-scrollback/Cargo.toml --release 2>&1 | tee spike-run.log
      - name: Calibrate segment granularity
        run: |
          rustc --edition=2024 -O spikes/issue-685-scrollback/src/segment_calibration.rs -o /tmp/segment-calibration
          /tmp/segment-calibration
      - name: Preserve evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-685-scrollback-spike-report
          path: |
            spike-report.md
            segment-calibration.md
            spike-check.log
            spike-run.log
          if-no-files-found: warn
