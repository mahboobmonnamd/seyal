name: Pass 8 Native UI Test Helper

on:
  push:
    branches:
      - issue/715-pass8-block-metadata

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/715-pass8-block-metadata
      - run: python3 scripts/pass8-native-ui-test-patch.py
      - run: git diff --check
      - name: Commit native UI coverage
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macos/Seyal/Tests/SeyalUITests/SeyalShellUITests.swift
          git commit -m "Pass 8: validate real Runtime metadata through native app"
          git push origin HEAD:issue/715-pass8-block-metadata
