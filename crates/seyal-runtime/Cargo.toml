[package]
name = "seyal-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[features]
default = []
test-fault-injection = []

[dependencies]
seyal-exec = { path = "../seyal-exec" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
stats_alloc = "=0.1.10"

[lints.rust]
unsafe_code = "deny"

[[bench]]
name = "runtime_scalability"
harness = false

[[bench]]
name = "pass5_transport_stress"
harness = false
