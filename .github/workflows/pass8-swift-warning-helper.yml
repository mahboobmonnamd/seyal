name: Pass 8 Swift Warning Helper

on:
  push:
    branches:
      - issue/715-pass8-block-metadata

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/715-pass8-block-metadata
      - run: python3 scripts/pass8-swift-warning-patch.py
      - run: git diff --check
      - name: Commit Swift concurrency warning cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macos/Seyal/Sources/MetalSurfaceView.swift macos/Seyal/Sources/RendererValidation.swift
          git commit -m "Pass 8: clean native Swift concurrency warnings"
          git push origin HEAD:issue/715-pass8-block-metadata
