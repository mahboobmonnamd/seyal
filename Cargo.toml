[workspace]
members = [
    "crates/seyal-terminal",
    "crates/seyal-exec",
    "crates/seyal-runtime",
    "crates/seyal-render",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/mahboobmonnamd/seyal"

[workspace.lints.rust]
unsafe_code = "forbid"
