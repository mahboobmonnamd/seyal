[package]
name = "seyal-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
test-fault-injection = []
# Opt-in so `cargo bench --workspace` / native-macos-smoke `make bench` does not
# compile this comparative harness on the 35-minute hosted job. Evidence runs:
# cargo bench -p seyal-terminal --bench history_reflow --features history-reflow-bench
history-reflow-bench = []

[[bench]]
name = "vt_parser_state"
harness = false

[[bench]]
name = "vt_scroll_state"
harness = false

[[bench]]
name = "history_reflow"
harness = false
required-features = ["history-reflow-bench"]

[lints]
workspace = true

[dependencies]
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.2", default-features = false, features = ["cjk"] }

[dev-dependencies]
stats_alloc = "=0.1.10"
