name: Pass 5 Bench Repair

on:
  push:
    branches:
      - issue/105-m001-pass-5-implementation
    paths:
      - .github/workflows/pass5-bench-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/105-m001-pass-5-implementation
      - name: Repair benchmark target discovery and allocator instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          delta = Path('crates/seyal-runtime/benches/pass5_delta_transport.rs')
          text = delta.read_text()
          old = 'use stats_alloc::{INSTRUMENTED_SYSTEM, StatsAlloc};'
          new = 'use stats_alloc::{INSTRUMENTED_SYSTEM, Region, StatsAlloc};'
          if old not in text:
              raise SystemExit('expected delta import not found')
          delta.write_text(text.replace(old, new, 1))

          ids = Path('crates/seyal-runtime/src/ids.rs')
          text = ids.read_text()
          block = '''impl ProjectionId {\n    #[cfg(any(feature = "benchmark-shared-projection", test))]\n    pub(crate) fn new() -> Self {\n        Self(unique_id(0x5052_4f4a_4543_5401))\n    }\n}\n\n'''
          if block not in text:
              raise SystemExit('expected obsolete ProjectionId constructor block not found')
          ids.write_text(text.replace(block, '', 1))

          cargo = Path('crates/seyal-runtime/Cargo.toml')
          text = cargo.read_text()
          if 'autobenches = false' not in text:
              text = text.replace('publish = false\n', 'publish = false\nautobenches = false\n', 1)
          legacy = '''[[bench]]\nname = "runtime_scalability"\nharness = false\nrequired-features = ["benchmark-shared-projection"]\n\n'''
          if legacy not in text:
              raise SystemExit('expected legacy runtime_scalability target not found')
          cargo.write_text(text.replace(legacy, '', 1))
          PY
      - name: Format and verify Linux all-targets all-features
        run: |
          make bootstrap
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/seyal-runtime/Cargo.toml crates/seyal-runtime/src/ids.rs crates/seyal-runtime/benches/pass5_delta_transport.rs
          git commit -m 'fix: isolate obsolete Pass 5 benchmark target'
          git push origin HEAD:issue/105-m001-pass-5-implementation
