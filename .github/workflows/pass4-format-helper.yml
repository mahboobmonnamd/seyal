name: Pass 4 Format Helper

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'issue/99-m001-pass-4-headless-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: issue/99-m001-pass-4-headless-runtime
      - name: Apply final review correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/seyal-runtime/src/runtime.rs')
          text = path.read_text()
          old = '''        if let Some(exit) = execution.try_wait()? {
            self.reactor.deregister(token)?;
            return Err(RuntimeError::ChildExitedBeforePublication(exit));
        }
'''
          new = '''        match execution.try_wait() {
            Ok(Some(exit)) => {
                self.reactor.deregister(token)?;
                return Err(RuntimeError::ChildExitedBeforePublication(exit));
            }
            Ok(None) => {}
            Err(error) => {
                let _ = self.reactor.deregister(token);
                self.kill_unpublished(execution);
                return Err(error.into());
            }
        }
'''
          if old not in text:
              raise SystemExit('expected create/register reconciliation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          make bootstrap
          cargo +1.98.0 fmt --all
          git rm .github/workflows/pass4-format-helper.yml .github/workflows/pass4-review-fix.yml
      - name: Commit final correction and helper cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates .github/workflows
          git commit -m 'fix: close registration reconciliation rollback gap'
          git push origin HEAD:issue/99-m001-pass-4-headless-runtime
