name: Pass 8 Rustfmt Helper

on:
  push:
    branches:
      - issue/715-pass8-block-metadata

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/715-pass8-block-metadata
      - run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
      - run: git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Pass 8: apply rustfmt after Pass 7.1 merge"
          git push origin HEAD:issue/715-pass8-block-metadata
