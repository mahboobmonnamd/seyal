name: Pass 5 Short Benchmark Path

on:
  push:
    branches:
      - issue/105-m001-pass-5-implementation
    paths:
      - .github/workflows/pass5-short-benchmark-path.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue/105-m001-pass-5-implementation
      - name: Shorten benchmark-only runtime paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/seyal-runtime/benches/pass5_production_transport.rs')
          s = p.read_text()
          old = '''    let suffix = format!(
        "{}-{}-{}-{}x{}-{}",
        process::id(),
        workload.name(),
        requested_population,
        columns,
        rows,
        requested_fanout
    );
    let mut config = RuntimeConfig::m001().expect("M001 config");
    config.singleton_path = env::temp_dir().join(format!("s5p-{suffix}.lock"));
    let runtime_dir = env::temp_dir().join(format!("s5pd-{suffix}"));
'''
          new = '''    // Keep benchmark-owned filesystem paths intentionally short. Darwin Unix-domain
    // sockets have a 104-byte sun_path limit, while workload identity is already
    // carried in the benchmark result fields. Each worker is a fresh process, so
    // the PID is sufficient to isolate its temporary Runtime directory.
    let suffix = format!("{:x}", process::id());
    let mut config = RuntimeConfig::m001().expect("M001 config");
    config.singleton_path = env::temp_dir().join(format!("s5p-{suffix}.lock"));
    let runtime_dir = env::temp_dir().join(format!("s5d-{suffix}"));
'''
          if s.count(old) != 1:
              raise SystemExit('expected benchmark path block exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Bootstrap pinned formatter
        run: make bootstrap
      - name: Format and validate patch
        run: |
          cargo fmt --all
          git diff --check
          git diff -- crates/seyal-runtime/benches/pass5_production_transport.rs
      - name: Commit benchmark path repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/seyal-runtime/benches/pass5_production_transport.rs
          git commit -m 'fix(bench): bound Candidate-D runtime socket path'
          git push origin HEAD:issue/105-m001-pass-5-implementation
