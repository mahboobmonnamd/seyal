name: Spike M002 Unicode 684

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - "spikes/m002-unicode-684/**"
      - ".github/workflows/spike-m002-unicode-684.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: spike-m002-unicode-684-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comparative-evidence:
    name: comparative-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install project Rust version
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add rustfmt --toolchain 1.98.0
          rustup override set 1.98.0
      - name: Format check
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt --manifest-path spikes/m002-unicode-684/Cargo.toml -- --check \
            2>&1 | tee /tmp/m002-unicode-684-format.txt
      - name: Deterministic corpus tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --manifest-path spikes/m002-unicode-684/Cargo.toml \
            2>&1 | tee /tmp/m002-unicode-684-tests.txt
      - name: Comparative measurements
        id: measurements
        continue-on-error: true
        run: |
          set -o pipefail
          cargo run --release --manifest-path spikes/m002-unicode-684/Cargo.toml \
            2>&1 | tee /tmp/m002-unicode-684-results.txt
      - name: Publish spike evidence to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- seyal-m002-unicode-684-ci -->'
            echo '### M002 Unicode #684 spike CI evidence'
            echo
            echo 'Non-mergeable R&D branch. Comparative numbers are CI-host evidence, not production latency gates.'
            echo
            echo '**Format check**'
            echo '```text'
            cat /tmp/m002-unicode-684-format.txt 2>/dev/null || true
            echo '```'
            echo
            echo '**Tests**'
            echo '```text'
            tail -n 80 /tmp/m002-unicode-684-tests.txt 2>/dev/null || true
            echo '```'
            echo
            echo '**Measurements**'
            echo '```text'
            cat /tmp/m002-unicode-684-results.txt 2>/dev/null || true
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
      - name: Enforce spike gates
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurements.outcome }}
        run: |
          test "$FORMAT_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$MEASUREMENT_OUTCOME" = success

  macos-shaping-evidence:
    name: macos-shaping-evidence
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile shaping probe
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          swiftc spikes/m002-unicode-684/shaping.swift \
            -o /tmp/m002-unicode-684-shaping \
            2>&1 | tee /tmp/m002-unicode-684-shaping-build.txt
      - name: Run shaping probe
        id: shaping
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          /tmp/m002-unicode-684-shaping \
            2>&1 | tee /tmp/m002-unicode-684-shaping-results.txt
      - name: Publish macOS shaping evidence to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- seyal-m002-unicode-684-shaping -->'
            echo '### M002 Unicode #684 macOS shaping evidence'
            echo
            echo 'Non-mergeable renderer-side evidence. CoreText metrics are observations only and never terminal-width authority.'
            echo
            echo '**Build**'
            echo '```text'
            cat /tmp/m002-unicode-684-shaping-build.txt 2>/dev/null || true
            echo '```'
            echo
            echo '**Shaping / cache measurements**'
            echo '```text'
            cat /tmp/m002-unicode-684-shaping-results.txt 2>/dev/null || true
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
      - name: Enforce shaping gates
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SHAPING_OUTCOME: ${{ steps.shaping.outcome }}
        run: |
          test "$COMPILE_OUTCOME" = success
          test "$SHAPING_OUTCOME" = success
